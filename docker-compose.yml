services:
  # ----------------------------------------------------------------------------
  # 1. Database Service: PostgreSQL
  # ----------------------------------------------------------------------------
  hardware-postgres:
    container_name: hardware-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hardware_db}
      POSTGRES_USER: ${POSTGRES_USER:-hardware_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hardware_secure_dev_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hardware-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hardware_user} -d ${POSTGRES_DB:-hardware_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Application Service: FastAPI
  # ----------------------------------------------------------------------------
  hardware-backend:
    container_name: hardware-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-True}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hardware_user:hardware_secure_dev_pass_2026@hardware-postgres:5432/hardware_db}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_hardware_store_key_change_in_production_min32chars!}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      MEDIA_STORAGE_PATH: /data/media
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api/v1}
      FRONTEND_DIR: /frontend
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - media_data:/data/media
    networks:
      - hardware-network
    depends_on:
      hardware-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Public Web Service: Nginx + Astro SSG Static Output
  # ----------------------------------------------------------------------------
  hardware-frontend:
    container_name: hardware-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend/deploy:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/data/media:ro
    networks:
      - hardware-network
    depends_on:
      hardware-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    name: hardware_postgres_data
  media_data:
    name: hardware_media_data

networks:
  hardware-network:
    name: hardware_internal_network
    driver: bridge
