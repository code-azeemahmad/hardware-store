<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#D4972B"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A96A33"/>
      <stop offset="50%" stop-color="#84481F"/>
      <stop offset="100%" stop-color="#542B0E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Outer Gold Trim Shield -->
    <path d="M0,-232 L202,-116 L202,116 L0,232 L-202,116 L-202,-116 Z"
          fill="url(#gold)" stroke="#1F120A" stroke-width="10" stroke-linejoin="round"/>

    <!-- Main Wood Shield -->
    <path d="M0,-210 L182,-105 L182,105 L0,210 L-182,105 L-182,-105 Z"
          fill="url(#wood)" stroke="#1F120A" stroke-width="8" stroke-linejoin="round"/>

    <!-- Inner Cream Badge -->
    <path d="M0,-155 L135,-77 L135,77 L0,155 L-135,77 L-135,-77 Z"
          fill="#FDF3E3" stroke="#D4972B" stroke-width="6" stroke-linejoin="round"/>

    <!-- Vertical Wood Planks -->
    <g transform="translate(0, -18)">
      <rect x="-90" y="-105" width="52" height="210" rx="10"
            fill="url(#wood)" stroke="#1F120A" stroke-width="5"/>
      <rect x="-26" y="-105" width="52" height="210" rx="10"
            fill="url(#wood)" stroke="#1F120A" stroke-width="5"/>
      <rect x="38" y="-105" width="52" height="210" rx="10"
            fill="url(#wood)" stroke="#1F120A" stroke-width="5"/>
    </g>

    <!-- Prominent High-Contrast Brand Text Plaque -->
    <rect x="-85" y="85" width="170" height="48" rx="8"
          fill="#1F120A" stroke="url(#gold)" stroke-width="3"/>
    <text x="0" y="121" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
          font-size="34" font-weight="900" letter-spacing="3" fill="#FFE082">NPH</text>
  </g>
</svg>