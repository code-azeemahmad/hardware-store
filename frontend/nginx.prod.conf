# ==============================================================================
# Naseer Plywood & Hardware — Production Nginx Configuration
# Multi-Domain TLS 1.2/1.3 Termination, HSTS, Security Headers, and ACME Webroot
# ==============================================================================

# HTTP Server — ACME Let's Encrypt Challenge & HTTPS 301 Redirection
server {
    listen 80;
    listen [::]:80;
    server_name naseerhardware.duckdns.org naseerhadware.duckdns.org;

    # Let's Encrypt ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to canonical HTTPS preserving request host
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — Production SSL, Reverse Proxy, Static Caching & Security Headers
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name naseerhardware.duckdns.org naseerhadware.duckdns.org;

    charset utf-8;
    client_max_body_size 20M;

    # SSL Certificates (Mounted from Let's Encrypt volume)
    ssl_certificate /etc/letsencrypt/live/naseerhadware.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naseerhadware.duckdns.org/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/naseerhadware.duckdns.org/chain.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Relative Redirects (Preserves Host, Port, and Protocol)
    absolute_redirect off;
    server_name_in_redirect off;

    # Production Hardened Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self'; frame-ancestors 'self';" always;

    # Static Media Files (Mounted from persistent volume)
    location ^~ /media/ {
        alias /data/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Persistent Product Images (Direct alias to media volume products directory)
    location ^~ /images/products/ {
        alias /data/media/products/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Reverse Proxy for FastAPI Backend
    location /api/ {
        proxy_pass http://hardware-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Subcategory Alias Permanent 301 Redirects (English)
    location ~* ^/kitchen/(sinks|faucets|baskets)/?$ {
        return 301 /kitchen/kitchen-$1/;
    }
    location ~* ^/hardware/(locks|handles|hinges)/?$ {
        return 301 /hardware/door-$1/;
    }
    location ~* ^/hardware/fittings/?$ {
        return 301 /hardware/architectural-fittings/;
    }
    location ~* ^/plywood/(commercial|marine)/?$ {
        return 301 /plywood/$1-plywood/;
    }

    # Subcategory Alias Permanent 301 Redirects (Urdu)
    location ~* ^/ur/kitchen/(sinks|faucets|baskets)/?$ {
        return 301 /ur/kitchen/kitchen-$1/;
    }
    location ~* ^/ur/hardware/(locks|handles|hinges)/?$ {
        return 301 /ur/hardware/door-$1/;
    }
    location ~* ^/ur/hardware/fittings/?$ {
        return 301 /ur/hardware/architectural-fittings/;
    }
    location ~* ^/ur/plywood/(commercial|marine)/?$ {
        return 301 /ur/plywood/$1-plywood/;
    }

    # Immutable Assets (Astro bundled CSS, JS, font assets)
    location /_astro/ {
        root /usr/share/nginx/html/current;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static Images, Favicons, and Fonts
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html/current;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Public Astro Static Files
    location / {
        root /usr/share/nginx/html/current;
        disable_symlinks off;
        index index.html index.htm;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Custom Error Pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
